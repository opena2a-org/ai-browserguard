<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Browser Guard</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- Header with status + kill switch -->
    <header id="header">
      <div class="header-row">
        <h1 class="header-title">AI Browser Guard</h1>
        <div id="status-indicator" class="status-badge status-idle">
          <span class="status-dot"></span>
          <span id="status-text">Monitoring</span>
        </div>
      </div>
      <div id="header-actions" class="header-actions">
        <button id="kill-switch-btn" class="btn btn-danger-compact" disabled>Kill Switch</button>
        <span class="header-shortcut"><kbd>Ctrl+Shift+K</kbd></span>
        <button id="settings-btn" class="settings-btn" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Recent block call-out (hidden when no fresh block) -->
    <section id="recent-block-callout" class="panel panel-danger hidden">
      <h2 class="panel-title-sm">Recently blocked</h2>
      <div id="recent-block-list"></div>
    </section>

    <!-- Detection status (compact when empty) -->
    <section id="detection-panel" class="panel">
      <div id="detection-content">
        <p class="placeholder-text-inline">No agents detected</p>
      </div>
    </section>

    <!-- Delegation controls -->
    <section id="delegation-panel" class="panel">
      <div id="delegation-content">
        <div class="delegation-empty">
          <span class="placeholder-text-inline">No delegation active</span>
          <button id="delegation-wizard-btn" class="btn btn-primary btn-sm">Configure</button>
        </div>
      </div>
      <div id="wizard-container" class="hidden"></div>
    </section>

    <!-- Boundary violations (hidden when empty) -->
    <section id="violations-panel" class="panel panel-collapsible hidden">
      <h2 class="panel-title-sm">Violations</h2>
      <div id="violations-list" class="event-list"></div>
    </section>

    <!-- Session timeline (hidden when empty) -->
    <section id="timeline-panel" class="panel panel-collapsible hidden">
      <h2 class="panel-title-sm">Timeline</h2>
      <div id="timeline-list" class="event-list"></div>
    </section>

    <!-- Protection summary (always visible, demonstrates ongoing value) -->
    <section id="metrics-panel" class="panel panel-collapsible hidden">
      <h2 class="panel-title-sm">Monitoring Summary</h2>
      <div id="metrics-grid" class="metrics-grid"></div>
      <div id="metrics-since" class="metrics-since"></div>
    </section>

    <!-- Settings panel (hidden by default) -->
    <section id="settings-panel" class="panel hidden">
      <h2 class="panel-title-sm">Settings</h2>
      <div id="settings-content"></div>
    </section>

    <!-- Footer -->
    <footer id="footer">
      <span class="footer-text">AI Browser Guard v__VERSION__</span>
      <span class="footer-separator">|</span>
      <span class="footer-text">OpenA2A</span>
    </footer>
  </div>

  <script type="module" src="./popup.ts"></script>
</body>
</html>
